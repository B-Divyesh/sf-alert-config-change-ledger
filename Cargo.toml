[package]
name = "alert-config-change-ledger"
version = "0.1.0"
edition = "2024"
description = "Read-only alert configuration snapshot and drift ledger"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-alert-config-change-ledger"
keywords = ["alerting", "grafana", "alertmanager", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "alert-ledger"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
